name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      TEST_POSTGRES_IMAGE: postgres:16-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run nox
