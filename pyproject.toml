[project]
name = "notes-webapp"
version = "0.1.0"
description = "A small production-shaped Django notes app for deployment experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=2.3,<4",
    "django>=5.2,<6",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "black>=25.1,<27",
    "django-stubs>=5.2,<6",
    "mypy>=1.15,<1.19",
    "nox>=2025.2,<2027",
    "pylint>=3.3,<5",
    "pylint-django>=2.6,<3",
    "pytest>=8.3,<10",
    "pytest-django>=4.10,<5",
    "testcontainers[postgres]>=4.13,<5",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["src/notes/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings"
ignore-paths = ["src/notes/migrations"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]
